name: Content Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: content-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-publish-guard:
    name: Auto Publish Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate publish safety and dedupe rules
        run: npm run validate:auto-publish
