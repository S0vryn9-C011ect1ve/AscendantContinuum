name: Content Guard

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: content-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  auto-publish-guard:
    name: Auto Publish Guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate publish safety and dedupe rules
        run: npm run validate:auto-publish
