name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.3.9f1
  PROJECT_PATH: .

jobs:
  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    continue-on-error: true  # Non-blocking until UNITY_LICENSE secret is configured
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: TestLibrary-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            TestLibrary-
            Library-

      - name: Run EditMode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: test-results/editmode

      - name: Run PlayMode Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          artifactsPath: test-results/playmode

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Test-Results
          path: test-results
          retention-days: 14

  # ============================================================================
  # BUILD JOB - Unity Builds
  # ============================================================================
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.runsOn }}
    needs: test
    continue-on-error: ${{ matrix.targetPlatform != 'WebGL' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: Android
            buildMethod: BuildMethods.BuildAndroid
            runsOn: ubuntu-latest
          - targetPlatform: iOS
            buildMethod: BuildMethods.BuildiOS
            runsOn: macos-latest
          - targetPlatform: WebGL
            buildMethod: BuildMethods.BuildWebGL
            runsOn: ubuntu-latest
    
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      
      # Cache Library folder
      - name: Cache Unity Library
        uses: actions/cache@v3
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-
      
      # Free disk space (for large builds - Linux only)
      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@main
        with:
          android: ${{ matrix.targetPlatform != 'Android' }}
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      
      # Build Unity project
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.targetPlatform }}
          buildsPath: Builds
          buildMethod: ${{ matrix.buildMethod }}
          versioning: Semantic
      
      # Upload build artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: Builds/${{ matrix.targetPlatform }}
          retention-days: 14
  
  # ============================================================================
  # FIREBASE DEPLOY JOB
  # ============================================================================
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json
      
      # Install Firebase Tools
      - name: Install Firebase Tools
        run: npm install -g firebase-tools
      
      # Install Cloud Functions dependencies
      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./firebase/functions
      
      # Deploy Firestore Rules
      - name: Deploy Firestore Rules
        continue-on-error: true
        run: firebase deploy --only firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
      
      # Deploy Storage Rules
      - name: Deploy Storage Rules
        continue-on-error: true
        run: firebase deploy --only storage:rules --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
      
      # Deploy Cloud Functions
      - name: Deploy Cloud Functions
        continue-on-error: true
        run: firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
      
      # Download WebGL build
      - name: Download WebGL Build
        uses: actions/download-artifact@v4
        with:
          name: Build-WebGL
          path: firebase/public
      
      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
  
  # ============================================================================
  # NOTIFICATIONS JOB
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-firebase]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-firebase.result }}" == "success" ]; then
            echo "✓ Firebase deployment successful!"
          else
            echo "✗ Firebase deployment failed: ${{ needs.deploy-firebase.result }}"
            exit 1
          fi
