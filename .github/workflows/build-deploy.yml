name: Build and Deploy

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege defaults; individual jobs override as needed.
permissions:
  contents: read

env:
  UNITY_VERSION: 6000.3.9f1
  PROJECT_PATH: .

jobs:
  content-guard:
    name: Content Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate publish safety and dedupe rules
        run: npm run validate:auto-publish

  test:
    name: Unity Tests
    runs-on: ubuntu-latest
    needs: content-guard
    # No continue-on-error: job fails hard when UNITY_LICENSE is configured.
    # Steps below are gated on the license-check output so CI stays green
    # on forks / environments where the secret is intentionally absent.
    steps:
      - name: Check UNITY_LICENSE is configured
        id: license-check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::warning::UNITY_LICENSE secret not configured — Unity tests skipped. Set this secret to enforce tests as a blocking quality gate."
            echo "licensed=false" >> $GITHUB_OUTPUT
          else
            echo "licensed=true" >> $GITHUB_OUTPUT
          fi

      - name: Checkout repository
        if: steps.license-check.outputs.licensed == 'true'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        if: steps.license-check.outputs.licensed == 'true'
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        with:
          path: Library
          key: TestLibrary-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            TestLibrary-
            Library-

      - name: Run EditMode Tests
        if: steps.license-check.outputs.licensed == 'true'
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9  # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          artifactsPath: test-results/editmode

      - name: Run PlayMode Tests
        if: steps.license-check.outputs.licensed == 'true'
        uses: game-ci/unity-test-runner@0ff419b913a3630032cbe0de48a0099b5a9f0ed9  # v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: PlayMode
          artifactsPath: test-results/playmode

      - name: Upload Test Results
        if: steps.license-check.outputs.licensed == 'true'
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b  # v4.3.4
        with:
          name: Unity-Test-Results
          path: test-results
          retention-days: 14

  # ============================================================================
  # BUILD JOB - Unity Builds
  # ============================================================================
  build:
    name: Build for ${{ matrix.targetPlatform }}
    runs-on: ${{ matrix.runsOn }}
    needs: test
    continue-on-error: ${{ matrix.targetPlatform != 'WebGL' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - targetPlatform: Android
            buildMethod: BuildMethods.BuildAndroid
            runsOn: ubuntu-latest
          - targetPlatform: iOS
            buildMethod: BuildMethods.BuildiOS
            runsOn: macos-latest
          - targetPlatform: WebGL
            buildMethod: BuildMethods.BuildWebGL
            runsOn: ubuntu-latest
    
    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          lfs: true
      
      # Cache Library folder
      - name: Cache Unity Library
        uses: actions/cache@6849a6489940f00c2f30c0fb92c6274307ccb58a  # v4.1.2
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.targetPlatform }}-
            Library-
      
      # Free disk space (for large builds - Linux only)
      - name: Free Disk Space
        if: runner.os == 'Linux'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be  # v1.3.1
        with:
          android: ${{ matrix.targetPlatform != 'Android' }}
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      
      # Decode Android keystore from base64 secret (only for Android builds)
      - name: Decode Android Keystore
        if: matrix.targetPlatform == 'Android'
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > /tmp/ascendant-release.keystore
          echo "ANDROID_KEYSTORE_PATH=/tmp/ascendant-release.keystore" >> $GITHUB_ENV
        shell: bash

      # Build Unity project
      - name: Build Unity Project
        uses: game-ci/unity-builder@1d4ee0697f193f54668e98961d79907911f4b4f2  # v4
        env:
          UNITY_LICENSE:          ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:            ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD:         ${{ secrets.UNITY_PASSWORD }}
          ANDROID_BUILD_NUMBER:   ${{ github.run_number }}
          ANDROID_BUILD_AAB:      "1"
          ANDROID_KEYSTORE_PATH:  ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASS:  ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEY_ALIAS:      ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASS: ${{ secrets.ANDROID_KEY_ALIAS_PASS }}
        with:
          unityVersion:    ${{ env.UNITY_VERSION }}
          targetPlatform:  ${{ matrix.targetPlatform }}
          buildsPath:      Builds
          buildMethod:     ${{ matrix.buildMethod }}
          versioning:      Semantic
      
      # Upload build artifacts
      - name: Upload Build Artifact
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b  # v4.3.4
        with:
          name: Build-${{ matrix.targetPlatform }}
          path: Builds/${{ matrix.targetPlatform }}
          retention-days: 14
  
  # ============================================================================
  # FIREBASE DEPLOY JOB
  # ============================================================================
  deploy-firebase:
    name: Deploy to Firebase
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json
      
      # Install Firebase Tools
      - name: Install Firebase Tools
        run: npm install -g firebase-tools@13
      
      # Install Cloud Functions dependencies
      - name: Install Functions Dependencies
        run: npm ci
        working-directory: ./firebase/functions
      
      # Deploy Firestore Rules
      - name: Deploy Firestore Rules
        continue-on-error: true
        run: firebase deploy --only firestore:rules --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
      
      # Deploy Storage Rules
      - name: Deploy Storage Rules
        continue-on-error: true
        run: firebase deploy --only storage:rules --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
      
      # Deploy Cloud Functions
      - name: Deploy Cloud Functions
        continue-on-error: true
        run: firebase deploy --only functions --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
      
      # Download WebGL build into /play/ subpage
      - name: Download WebGL Build
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e  # v4.1.7
        with:
          name: Build-WebGL
          path: firebase/public/play
      
      # Deploy to Firebase Hosting
      - name: Deploy to Firebase Hosting
        run: firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
        working-directory: ./firebase
  
  # ============================================================================
  # NOTIFICATIONS JOB
  # ============================================================================
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    needs: [deploy-firebase]
    if: always()
    steps:
      - name: Check deployment status
        run: |
          if [ "${{ needs.deploy-firebase.result }}" == "success" ]; then
            echo "✓ Firebase deployment successful!"
          else
            echo "✗ Firebase deployment failed: ${{ needs.deploy-firebase.result }}"
            exit 1
          fi
