name: Claude Code Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-structure:
    name: Validate Claude Code Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify CLAUDE.md exists
        run: |
          if [ ! -f "CLAUDE.md" ]; then
            echo "::error::CLAUDE.md not found in root"
            exit 1
          fi
          echo "✓ CLAUDE.md found"

      - name: Verify .claude/ structure
        run: |
          required_files=(
            ".claude/settings.json"
            ".claude/review.md"
            ".claude/README.md"
          )
          
          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error::Required file missing: $file"
              exit 1
            fi
          done
          
          echo "✓ All required files present"

      - name: Validate settings.json syntax
        run: |
          if ! jq empty .claude/settings.json 2>/dev/null; then
            echo "::error::Invalid JSON in settings.json"
            exit 1
          fi
          echo "✓ settings.json is valid JSON"

      - name: Check Firebase rate limits
        run: |
          if ! grep -q "rateLimit" firebase/firestore.rules; then
            echo "::warning::No rate limits found in Firestore rules"
          else
            echo "✓ Rate limits present in Firestore rules"
          fi

      - name: Verify cost monitoring
        run: |
          if [ ! -f ".claude/skills/firebase-cost-monitor.md" ]; then
            echo "::warning::Firebase cost monitoring skill not found"
          else
            echo "✓ Cost monitoring skill present"
          fi

      - name: Check for Unity build skill
        run: |
          if [ ! -f ".claude/skills/unity-build.md" ]; then
            echo "::warning::Unity build skill not found"
          else
            echo "✓ Unity build skill present"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Claude Code Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "✅ Project structure follows Claude Code best practices" >> $GITHUB_STEP_SUMMARY
          echo "✅ AI-assisted development ready" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📂 Files validated:" >> $GITHUB_STEP_SUMMARY
          echo "- CLAUDE.md (project memory)" >> $GITHUB_STEP_SUMMARY
          echo "- .claude/settings.json (configuration)" >> $GITHUB_STEP_SUMMARY
          echo "- .claude/skills/ (modular expertise)" >> $GITHUB_STEP_SUMMARY
          echo "- firebase/firestore.rules (rate limits)" >> $GITHUB_STEP_SUMMARY
