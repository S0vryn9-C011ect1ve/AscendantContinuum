name: Weekly Maintenance

on:
  schedule:
    # Runs every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  maintenance:
    name: Automated Project Maintenance
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Run maintenance tasks
        shell: pwsh
        run: |
          Write-Host "Running automated maintenance..." -ForegroundColor Cyan
          .\Maintenance.ps1
          
      - name: Audit npm dependencies
        run: npm audit --production

      - name: Check for large files
        shell: pwsh
        run: |
          $largeFiles = Get-ChildItem . -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Length -gt 50MB -and $_.DirectoryName -notmatch "Library|Builds|node_modules" } |
            Select-Object -First 5
          
          if ($largeFiles.Count -gt 0) {
            Write-Host "::warning::Large files detected - review for optimization"
          }

      - name: Verify Firebase rate limits
        shell: pwsh
        run: |
          $rulesContent = Get-Content firebase/firestore.rules -Raw
          if ($rulesContent -notmatch "rateLimit\(") {
            Write-Host "::error::No rate limits found in Firestore rules!"
            exit 1
          }
          Write-Host "✓ Rate limits verified" -ForegroundColor Green

      - name: Create maintenance report
        if: always()
        shell: pwsh
        run: |
          $report = @"
          # Weekly Maintenance Report
          **Date:** $(Get-Date -Format "yyyy-MM-dd HH:mm UTC")
          
          ## Tasks Completed
          - Cleaned Unity temp files
          - Audited npm dependencies
          - Verified Firebase rate limits
          - Checked for large files
          
          ## Status
          ✓ Maintenance complete
          "@
          
          $report | Out-File -FilePath maintenance-report.md
          
      - name: Upload maintenance report
        if: always()
        uses: actions/upload-artifact@0b2256b8c012f0828dc542b3febcab082c67f72b # v4.3.4
        with:
          name: maintenance-report
          path: maintenance-report.md
          retention-days: 30
