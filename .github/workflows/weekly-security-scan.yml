name: Weekly Security Scan

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'firebase/functions/package.json'
      - 'firebase/functions/package-lock.json'

jobs:
  security-scan:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      # Main Project Scan
      - name: 🔍 Scan Main Project Dependencies
        run: |
          echo "=== Main Project Security Scan ==="
          npm list axios --depth=0 || true
          npm audit --audit-level=moderate || true
      
      # Firebase Functions Scan
      - name: 🔍 Scan Firebase Functions Dependencies
        working-directory: ./firebase/functions
        run: |
          echo "=== Firebase Functions Security Scan ==="
          npm list gaxios axios --depth=0 || true
          npm audit --audit-level=moderate || true
      
      # Check for compromised packages (based on latest threats)
      - name: 🚨 Check for Known Compromised Packages
        run: |
          echo "=== Checking for Known Compromised Packages ==="
          
          # Check axios versions (compromised: 1.14.1, 0.30.4)
          AXIOS_VERSION=$(npm list axios --depth=0 2>/dev/null | grep axios@ | sed 's/.*axios@//' | sed 's/ .*//')
          if [ "$AXIOS_VERSION" = "1.14.1" ] || [ "$AXIOS_VERSION" = "0.30.4" ]; then
            echo "⚠️ CRITICAL: Compromised axios version detected: $AXIOS_VERSION"
            exit 1
          else
            echo "✅ Axios version safe: $AXIOS_VERSION"
          fi
          
          # Check for malicious packages
          MALICIOUS_PACKAGES=(
            "litellm@1.82.7"
            "litellm@1.82.8"
            "separadordeinfocc"
          )
          
          for pkg in "${MALICIOUS_PACKAGES[@]}"; do
            if npm list "$pkg" --depth=999 2>/dev/null | grep -q "$pkg"; then
              echo "🚨 CRITICAL: Malicious package detected: $pkg"
              exit 1
            fi
          done
          
          echo "✅ No known malicious packages detected"
      
      # Generate security report
      - name: 📊 Generate Security Report
        if: always()
        run: |
          mkdir -p logs
          
          cat > logs/weekly-security-scan-$(date +%Y-%m-%d).md << 'EOF'
          # Weekly Security Scan Report
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Triggered by:** ${{ github.event_name }}
          
          ## Main Project
          
          ### Dependencies
          \`\`\`
          $(npm list axios --depth=0 2>&1)
          \`\`\`
          
          ### Vulnerabilities
          \`\`\`
          $(npm audit --audit-level=moderate 2>&1 || echo "Audit completed with warnings")
          \`\`\`
          
          ## Firebase Functions
          
          ### Dependencies
          \`\`\`
          $(cd firebase/functions && npm list gaxios axios --depth=0 2>&1)
          \`\`\`
          
          ### Vulnerabilities
          \`\`\`
          $(cd firebase/functions && npm audit --audit-level=moderate 2>&1 || echo "Audit completed with warnings")
          \`\`\`
          
          ## Protection Status
          
          - ✅ min-release-age=7 days configured
          - ✅ ignore-scripts=true configured
          - ✅ package-lock.json committed
          - ✅ Security overrides active
          
          ## Known Threats (April 2026)
          
          - axios 1.14.1, 0.30.4 - Supply chain attack ⚠️
          - LiteLLM 1.82.7, 1.82.8 - Credential exfiltration ⚠️
          - separadordeinfocc - LofyGang malware ⚠️
          
          **Status:** Protected via version pinning and 7-day delay
          EOF
          
          cat logs/weekly-security-scan-$(date +%Y-%m-%d).md
      
      - name: 📤 Upload Security Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-report-${{ github.run_number }}
          path: logs/weekly-security-scan-*.md
          retention-days: 90
      
      # Create issue if high/critical vulnerabilities found
      - name: 🚨 Create Security Issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Security Scan Failed - ' + new Date().toISOString().split('T')[0],
              body: `## Security Scan Alert
              
              The weekly security scan has detected issues that require immediate attention.
              
              **Scan Date:** ${new Date().toUTCString()}
              **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              
              ### Action Required
              1. Review the scan results in the workflow logs
              2. Check for compromised package versions
              3. Update dependencies if needed
              4. Run \`npm run security:full-scan\` locally
              
              ### Known Active Threats (April 2026)
              - axios 1.14.1, 0.30.4
              - LiteLLM 1.82.7, 1.82.8
              - separadordeinfocc (LofyGang)
              
              See [Security Policy](SECURITY.md) for response procedures.`,
              labels: ['security', 'high-priority']
            })

  # Optional: Socket.dev scan (if Socket CLI is available)
  socket-scan:
    name: Socket.dev Malware Protection
    runs-on: ubuntu-latest
    continue-on-error: true # Don't fail workflow if Socket not configured
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: 🛡️ Run Socket.dev Scan
        run: |
          # Install Socket.dev CLI (sfw)
          npm install -g @socketsecurity/cli || echo "Socket CLI not available"
          
          # Scan main project
          echo "=== Socket.dev Scan: Main Project ==="
          socket scan . || echo "Socket scan completed with warnings"
          
          # Scan Firebase Functions
          echo "=== Socket.dev Scan: Firebase Functions ==="
          cd firebase/functions
          socket scan . || echo "Socket scan completed with warnings"
