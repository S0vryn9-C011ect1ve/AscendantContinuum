name: Weekly Security Scan

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'firebase/functions/package.json'
      - 'firebase/functions/package-lock.json'

permissions:
  contents: read
  issues: write  # Required for auto-creating security alert issues

jobs:
  security-scan:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'
      
      # Main Project Scan
      - name: 🔍 Scan Main Project Dependencies
        run: |
          echo "=== Main Project Security Scan ==="
          npm list axios --depth=0 || true
          npm audit --audit-level=moderate || true
      
      # Firebase Functions Scan
      - name: 🔍 Scan Firebase Functions Dependencies
        working-directory: ./firebase/functions
        run: |
          echo "=== Firebase Functions Security Scan ==="
          npm list gaxios axios --depth=0 || true
          npm audit --audit-level=moderate || true
      
      # Check for compromised packages (based on latest threats)
      - name: 🚨 Check for Known Compromised Packages
        id: threat-scan
        run: |
          echo "=== Checking for Known Compromised Packages ==="
          
          THREATS_FOUND=0
          THREAT_DETAILS=""
          
          # Check axios versions (compromised: 1.14.1, 0.30.4)
          AXIOS_VERSION=$(npm list axios --depth=0 2>/dev/null | grep axios@ | sed 's/.*axios@//' | sed 's/ .*//')
          if [ "$AXIOS_VERSION" = "1.14.1" ] || [ "$AXIOS_VERSION" = "0.30.4" ]; then
            echo "⚠️ CRITICAL: Compromised axios version detected: $AXIOS_VERSION"
            THREATS_FOUND=$((THREATS_FOUND + 1))
            THREAT_DETAILS="${THREAT_DETAILS}- axios@${AXIOS_VERSION} (COMPROMISED)\n"
          else
            echo "✅ Axios version safe: $AXIOS_VERSION"
          fi
          
          # April 2026 threat database
          MALICIOUS_PACKAGES=(
            "litellm@1.82.7"
            "litellm@1.82.8"
            "separadordeinfocc"
            "strapi-plugin-health"
            "strapi-plugin-sync"
            "strapi-plugin-seed"
            "strapi-plugin-locale"
            "strapi-plugin-form"
            "strapi-plugin-notify"
            "strapi-plugin-api"
            "mgc@1.2.1"
            "mgc@1.2.2"
            "mgc@1.2.3"
            "mgc@1.2.4"
          )
          
          for pkg in "${MALICIOUS_PACKAGES[@]}"; do
            if npm list "$pkg" --depth=999 2>/dev/null | grep -q "$pkg"; then
              echo "🚨 CRITICAL: Malicious package detected: $pkg"
              THREATS_FOUND=$((THREATS_FOUND + 1))
              THREAT_DETAILS="${THREAT_DETAILS}- ${pkg} (MALICIOUS)\n"
            fi
          done
          
          echo "threats_found=$THREATS_FOUND" >> $GITHUB_OUTPUT
          echo "threat_details<<EOF" >> $GITHUB_OUTPUT
          echo -e "$THREAT_DETAILS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          
          if [ $THREATS_FOUND -gt 0 ]; then
            echo "🚨 ALERT: $THREATS_FOUND compromised packages detected!"
            exit 1
          else
            echo "✅ No known malicious packages detected"
          fi
      
      # Generate security report
      - name: 📊 Generate Security Report
        if: always()
        run: |
          mkdir -p logs
          
          cat > logs/weekly-security-scan-$(date +%Y-%m-%d).md << 'EOF'
          # Weekly Security Scan Report
          
          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Triggered by:** ${{ github.event_name }}
          
          ## Main Project
          
          ### Dependencies
          \`\`\`
          $(npm list axios --depth=0 2>&1)
          \`\`\`
          
          ### Vulnerabilities
          \`\`\`
          $(npm audit --audit-level=moderate 2>&1 || echo "Audit completed with warnings")
          \`\`\`
          
          ## Firebase Functions
          
          ### Dependencies
          \`\`\`
          $(cd firebase/functions && npm list gaxios axios --depth=0 2>&1)
          \`\`\`
          
          ### Vulnerabilities
          \`\`\`
          $(cd firebase/functions && npm audit --audit-level=moderate 2>&1 || echo "Audit completed with warnings")
          \`\`\`
          
          ## Protection Status
          
          - ✅ min-release-age=7 days configured
          - ✅ ignore-scripts=true configured
          - ✅ package-lock.json committed
          - ✅ Security overrides active
          
          ## Known Threats (April 2026)
          
          - axios 1.14.1, 0.30.4 - Supply chain attack ⚠️
          - LiteLLM 1.82.7, 1.82.8 - Credential exfiltration ⚠️
          - separadordeinfocc - LofyGang malware ⚠️
          
          **Status:** Protected via version pinning and 7-day delay
          EOF
          
          cat logs/weekly-security-scan-$(date +%Y-%m-%d).md
      
      - name: 📤 Upload Security Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: security-scan-report-${{ github.run_number }}
          path: logs/weekly-security-scan-*.md
          retention-days: 90
      
      # Create issue if high/critical vulnerabilities found
      - name: 🚨 Create Security Alert Issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const threatDetails = `${{ steps.threat-scan.outputs.threat_details }}` || 'Unknown threats detected';
            const threatsFound = `${{ steps.threat-scan.outputs.threats_found }}` || 'unknown';
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 SECURITY ALERT: Compromised Packages Detected - ' + new Date().toISOString().split('T')[0],
              labels: ['security', 'critical', 'automated'],
              body: `## 🚨 CRITICAL SECURITY ALERT
              
              **Automated scan detected ${threatsFound} compromised package(s) in Ascendant Continuum project.**
              
              ### ⚠️ Threats Detected
              
              ${threatDetails}
              
              ### 🛡️ Immediate Actions Required
              
              1. **DO NOT** install or update any packages until resolved
              2. Review \`package-lock.json\` for suspicious changes
              3. Run manual audit: \`npm audit\`
              4. Check for unauthorized git commits
              5. Rotate all API keys and credentials (assume compromise)
              
              ### 📊 Scan Details
              
              - **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              - **Triggered By:** ${{ github.event_name }}
              - **Branch:** ${{ github.ref_name }}
              - **Commit:** ${{ github.sha }}
              
              ### 📋 Next Steps
              
              - [ ] Verify threat authenticity (check npm advisories)
              - [ ] Update \`package.json\` overrides to block compromised versions
              - [ ] Test all functionality after remediation
              - [ ] Update threat database in \`docs/security/SUPPLY_CHAIN_PROTECTION.md\`
              - [ ] Close this issue once resolved
              
              ### 🔗 Resources
              
              - [Supply Chain Protection Guide](docs/security/SUPPLY_CHAIN_PROTECTION.md)
              - [Security Audit Report](SECURITY_AUDIT_APRIL_6_2026.md)
              - [npm Security Advisories](https://www.npmjs.com/advisories)
              - [Socket.dev Blog](https://socket.dev/blog)
              
              ---
              
              **Priority:** 🔴 CRITICAL  
              **Auto-generated by:** Weekly Security Scan  
              **Assignee:** @${{ github.repository_owner }}
              `
            });
      
      # Send email notification on failure (if email configured)
      - name: 📧 Send Email Alert
        if: failure()
        run: |
          echo "🚨 SECURITY ALERT: Scan failed - compromised packages detected"
          echo "Issue created in GitHub: Check repository notifications"
          echo ""
          echo "To enable email alerts, configure GitHub repository settings:"
          echo "Settings > Notifications > Email notifications"
          echo ""
          echo "Or add email delivery using GitHub Actions marketplace actions"
              
              **Scan Date:** ${new Date().toUTCString()}
              **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              
              ### Action Required
              1. Review the scan results in the workflow logs
              2. Check for compromised package versions
              3. Update dependencies if needed
              4. Run \`npm run security:full-scan\` locally
              
              ### Known Active Threats (April 2026)
              - axios 1.14.1, 0.30.4
              - LiteLLM 1.82.7, 1.82.8
              - separadordeinfocc (LofyGang)
              
              See [Security Policy](SECURITY.md) for response procedures.`,
              labels: ['security', 'high-priority']
            })

  # Optional: Socket.dev scan (if Socket CLI is available)
  socket-scan:
    name: Socket.dev Malware Protection
    runs-on: ubuntu-latest
    continue-on-error: true # Don't fail workflow if Socket not configured
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: '20'
      
      - name: 🛡️ Run Socket.dev Scan
        run: |
          # Install Socket.dev CLI (sfw)
          npm install -g @socketsecurity/cli || echo "Socket CLI not available"
          
          # Scan main project
          echo "=== Socket.dev Scan: Main Project ==="
          socket scan . || echo "Socket scan completed with warnings"
          
          # Scan Firebase Functions
          echo "=== Socket.dev Scan: Firebase Functions ==="
          cd firebase/functions
          socket scan . || echo "Socket scan completed with warnings"
