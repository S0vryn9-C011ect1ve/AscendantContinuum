name: CodeQL Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 8 AM UTC (before the weekly security scan at 9 AM)
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write  # Required to upload SARIF results to GitHub Security tab

jobs:
  # ── JavaScript / Node.js analysis ──────────────────────────────────────────
  analyze-javascript:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: javascript
          # Focus on the automation scripts and avoid Unity-generated files
          config: |
            paths:
              - scripts
              - firebase/functions
            paths-ignore:
              - node_modules
              - firebase/functions/node_modules
              - Library
              - Temp

      - name: Autobuild
        uses: github/codeql-action/autobuild@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: "/language:javascript"

  # ── C# (Unity) analysis ────────────────────────────────────────────────────
  # CodeQL requires the project to be buildable. This job uses the generated
  # .csproj files from the Unity project (Assembly-CSharp.csproj) via dotnet.
  # It runs only on main/develop pushes (not PRs) to avoid consuming large runner
  # minutes on every PR while the Unity build tooling is being set up.
  analyze-csharp:
    name: Analyze C#
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          languages: csharp
          build-mode: none
          config: |
            paths:
              - Assets/_Project/Scripts
            paths-ignore:
              - Library
              - Temp
              - obj

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd  # v4.37.7
        with:
          category: "/language:csharp"
