name: CodeQL Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 8 AM UTC (before the weekly security scan at 9 AM)
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write  # Required to upload SARIF results to GitHub Security tab

jobs:
  # ── JavaScript / Node.js analysis ──────────────────────────────────────────
  analyze-javascript:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          languages: javascript
          # Focus on the automation scripts and avoid Unity-generated files
          config: |
            paths:
              - scripts
              - firebase/functions
            paths-ignore:
              - node_modules
              - firebase/functions/node_modules
              - Library
              - Temp

      - name: Autobuild
        uses: github/codeql-action/autobuild@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          category: "/language:javascript"

  # ── C# (Unity) analysis ────────────────────────────────────────────────────
  # CodeQL requires the project to be buildable. This job uses the generated
  # .csproj files from the Unity project (Assembly-CSharp.csproj) via dotnet.
  # It runs only on main/develop pushes (not PRs) to avoid consuming large runner
  # minutes on every PR while the Unity build tooling is being set up.
  analyze-csharp:
    name: Analyze C#
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          languages: csharp
          build-mode: none
          config: |
            paths:
              - Assets/_Project/Scripts
            paths-ignore:
              - Library
              - Temp
              - obj

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@99df26d4f13ea111d4ec1a7dddef6063f76b97e9  # v4.37.0
        with:
          category: "/language:csharp"
