name: CodeQL Analysis

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday at 8 AM UTC (before the weekly security scan at 9 AM)
    - cron: '0 8 * * 1'
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write  # Required to upload SARIF results to GitHub Security tab

jobs:
  # ── JavaScript / Node.js analysis ──────────────────────────────────────────
  analyze-javascript:
    name: Analyze JavaScript
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c  # v3.28.1
        with:
          languages: javascript
          # Focus on the automation scripts and avoid Unity-generated files
          config: |
            paths:
              - scripts
              - firebase/functions
            paths-ignore:
              - node_modules
              - firebase/functions/node_modules
              - Library
              - Temp

      - name: Autobuild
        uses: github/codeql-action/autobuild@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c  # v3.28.1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c  # v3.28.1
        with:
          category: "/language:javascript"

  # ── C# (Unity) analysis ────────────────────────────────────────────────────
  # CodeQL requires the project to be buildable. This job uses the generated
  # .csproj files from the Unity project (Assembly-CSharp.csproj) via dotnet.
  # It runs only on main/develop pushes (not PRs) to avoid consuming large runner
  # minutes on every PR while the Unity build tooling is being set up.
  analyze-csharp:
    name: Analyze C#
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4.3.1
        with:
          dotnet-version: '8.0.x'

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c  # v3.28.1
        with:
          languages: csharp
          config: |
            paths:
              - Assets/_Project/Scripts
            paths-ignore:
              - Library
              - Temp
              - obj

      - name: Build C# (manual — dotnet build on editor .csproj)
        run: |
          # The Assembly-CSharp.csproj generated by Unity references Unity DLLs
          # that are not available outside Unity. We build only the runtime scripts
          # project which can be analysed standalone.
          if [ -f "AscendantContinuum.Runtime.csproj" ]; then
            dotnet build AscendantContinuum.Runtime.csproj \
              --no-restore \
              -p:Nullable=enable \
              -p:WarningLevel=0 \
              || echo "::warning::C# build produced warnings — CodeQL will analyse available sources."
          else
            echo "::warning::No standalone .csproj found — CodeQL will attempt autobuild."
            dotnet build Assembly-CSharp.csproj || true
          fi

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b6a472f63d85b9c78a3ac5e89422239fc15e9b3c  # v3.28.1
        with:
          category: "/language:csharp"
