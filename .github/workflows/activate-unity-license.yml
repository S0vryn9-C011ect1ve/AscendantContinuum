name: Activate Unity License (Run Once)

# Run this workflow ONCE to generate UNITY_LICENSE secret.
# Steps:
#   1. Trigger this workflow manually via Actions → "Run workflow"
#   2. Download the "Unity_v*.alf" artifact from the run
#   3. Go to https://license.unity3d.com/manual and upload the .alf file
#   4. Download the returned .ulf file
#   5. Copy the full contents of the .ulf file
#   6. Go to repo Settings → Secrets → Actions → New secret
#      Name: UNITY_LICENSE   Value: <paste entire .ulf file contents>
#   7. Delete this workflow or disable it — it is only needed once.

on:
  workflow_dispatch:

jobs:
  request-activation-file:
    name: Request Activation File
    runs-on: ubuntu-latest
    steps:
      - name: Request manual activation file
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.3.9f1

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: Unity_v6000.3.9f1_activation_file
          path: ./*.alf
          retention-days: 7
