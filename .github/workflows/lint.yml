name: Lint

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── actionlint: validate GitHub Actions workflow syntax ───────────────────
  actionlint:
    name: Validate Workflow Syntax (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Run actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -ignore SC2016

  # ── JSON validation ───────────────────────────────────────────────────────
  validate-json:
    name: Validate JSON Files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'

      - name: Validate JSON files
        run: |
          set -e
          ERRORS=0
          validate_json() {
            local file="$1"
            if node -e "JSON.parse(require('fs').readFileSync('$file','utf8'))" 2>/dev/null; then
              echo "  ✓ $file"
            else
              echo "  ✗ $file — INVALID JSON"
              ERRORS=$((ERRORS + 1))
            fi
          }
          echo "=== Validating JSON files ==="
          validate_json "package.json"
          [ -f "Packages/manifest.json" ]        && validate_json "Packages/manifest.json"
          [ -f "Packages/packages-lock.json" ]   && validate_json "Packages/packages-lock.json"
          [ -f ".github/dependabot.yml" ] || true  # YAML checked elsewhere
          # Scan for any other JSON files in scripts/
          find scripts/ -name "*.json" 2>/dev/null | while read f; do validate_json "$f"; done
          if [ $ERRORS -gt 0 ]; then
            echo ""
            echo "::error::$ERRORS JSON file(s) failed validation."
            exit 1
          fi
          echo ""
          echo "All JSON files are valid."

  # ── Markdown lint ─────────────────────────────────────────────────────────
  markdown-lint:
    name: Lint Markdown
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'

      - name: Run markdownlint-cli2
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}" --depth=1
            mapfile -t md_files < <(git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '\\.md$' || true)
          else
            mapfile -t md_files < <(git diff --name-only HEAD~1 HEAD | grep -E '\\.md$' || true)
          fi

          if [ ${#md_files[@]} -eq 0 ]; then
            echo "No Markdown files changed. Skipping markdownlint."
            exit 0
          fi

          printf 'Linting changed markdown files:\n%s\n' "${md_files[@]}"
          npx --yes markdownlint-cli2@0.17.2 "${md_files[@]}"

  # ── npm audit: check for known vulnerabilities ───────────────────────────
  npm-audit:
    name: npm audit (critical only)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Audit for critical vulnerabilities
        # Fail only on critical; the weekly-security-scan handles moderate/high
        run: npm audit --audit-level=critical
