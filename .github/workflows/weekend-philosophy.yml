name: Weekend Philosophy Posts

on:
  schedule:
    # Saturdays and Sundays at 4 PM UTC (11 AM EST / 8 AM PST)
    - cron: '0 16 * * 0,6'
  workflow_dispatch: # Allow manual triggering

concurrency:
  group: weekend-philosophy-posting
  cancel-in-progress: false

jobs:
  post-philosophy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm install

      - name: 🚀 Post philosophy content
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: 'false'
        run: node scripts/automation/post-philosophy.js

      - name: 💾 Commit posting history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/social/posting-history.json
          git diff --quiet && git diff --staged --quiet || git commit -m "📊 Update philosophy posting history [skip ci]"
          git push

      - name: 🔔 Notify on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '❌ Weekend Philosophy Posting Failed',
              body: `
              The weekend philosophy posting workflow failed.

              **Workflow Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
              **Time:** ${new Date().toISOString()}
              
              Please check the logs and credentials.
              `,
              labels: ['automation', 'social-media', 'bug']
            })
