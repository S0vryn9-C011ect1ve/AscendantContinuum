name: Dev Update Social Posts

on:
  schedule:
    # Run weekly on Monday at 8 PM UTC
    - cron: '0 20 * * 1'
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write

concurrency:
  group: dev-update-posting
  cancel-in-progress: false

jobs:
  check-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0  # Full history for dev update generation
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🚀 Post dev update
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DRY_RUN: 'false'
        run: node scripts/automation/post-dev-update.js

      - name: 💾 Commit posting history
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/social/posting-history.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "📊 Update dev posting history [skip ci]"
            git push
          fi
