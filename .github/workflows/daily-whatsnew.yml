name: Daily What's New Update

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 23 * * *'  # Daily at 11 PM UTC (6 PM EST) - end of day
  workflow_dispatch:  # Manual trigger
    inputs:
      force:
        description: 'Force generation even if no user-facing changes detected'
        required: false
        default: 'false'
        type: boolean

# Prevent concurrent runs
concurrency:
  group: whatsnew-daily
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate-whatsnew:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0  # Full history for commit analysis
      
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate What's New update
        run: node scripts/automation/generate-whatsnew.js ${{ github.event.inputs.force == 'true' && '--force' || '' }}
      
      - name: Commit What's New changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add firebase/public/whats-new/data.json firebase/public/blog/posts/daily-update-*.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "CHANGES_COMMITTED=false" >> $GITHUB_ENV
          else
            git commit -m "chore: daily What's New update $(date +%Y-%m-%d)"
            if git push; then
              echo "CHANGES_COMMITTED=true" >> $GITHUB_ENV
            else
              echo "::warning::Direct push blocked by repository rules; skipping deploy/social for this run."
              echo "CHANGES_COMMITTED=false" >> $GITHUB_ENV
            fi
          fi
      
      - name: Deploy to Firebase
        if: env.CHANGES_COMMITTED == 'true'
        run: |
          cd firebase
          npm install -g firebase-tools@13
          firebase deploy --only hosting --token "${{ secrets.FIREBASE_TOKEN }}"
      
      - name: Post to social media
        if: env.CHANGES_COMMITTED == 'true'
        env:
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_PASSWORD: ${{ secrets.BLUESKY_PASSWORD }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          MASTODON_API_URL: ${{ secrets.MASTODON_API_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node scripts/automation/post-whatsnew-update.js
